# Affiliate Hub API — Cloudflare Workers configuration
#
# Setup:
#   1. Create the D1 database:        npx wrangler d1 create affiliate-hub
#   2. Paste the returned database_id below.
#   3. Init + seed:                   npm run db:init && npm run db:seed
#   4. Set secrets:                   npx wrangler secret put JWT_SECRET
#   5. Deploy:                        npm run deploy

name = "affiliate-hub-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Non-secret configuration only. Anything environment-specific (CORS_ORIGIN,
# PUBLIC_FRONTEND_URL, PUBLIC_API_URL, JWT_SECRET, AFFILIATE_WEBHOOK_SECRET, ...)
# MUST NOT be committed here — set them with `npx wrangler secret put <NAME>` for
# production, or in `.dev.vars` for local dev (see .dev.vars.example).
#
# IMPORTANT: do not add localhost URLs to [vars] — they would be deployed to
# production and break share links / OAuth callbacks.
[vars]
# Naira per US Dollar rate used for the USD balance card.
FX_NGN_PER_USD = "1500"

[[d1_databases]]
binding = "DB"
database_name = "affiliate-hub"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
