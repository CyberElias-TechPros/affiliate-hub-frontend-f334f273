# Affiliate Hub API — Cloudflare Workers configuration
#
# Setup:
#   1. Create the D1 database:        npx wrangler d1 create affiliate-hub
#   2. Paste the returned database_id below.
#   3. Init + seed:                   npm run db:init && npm run db:seed
#   4. Set secrets:                   npx wrangler secret put JWT_SECRET
#   5. Deploy:                        npm run deploy

name = "affiliate-hub-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Non-secret configuration. Secrets (JWT_SECRET, GOOGLE_CLIENT_SECRET, ...) must be
# set with `npx wrangler secret put <NAME>` (see .dev.vars.example for the full list).
[vars]
# Comma-separated list of allowed CORS origins (must include your Vercel URL).
CORS_ORIGIN = "http://localhost:5173,http://localhost:8080"
# Public URL of the frontend (used for shareable affiliate/referral links).
PUBLIC_FRONTEND_URL = "http://localhost:5173"
# Public URL of this API (used for OAuth redirect URIs).
PUBLIC_API_URL = "http://localhost:8787"
# Naira per US Dollar rate used for the USD balance card.
FX_NGN_PER_USD = "1500"
# Optional: strongly recommended in production. Protects the conversion webhook.
AFFILIATE_WEBHOOK_SECRET = ""

[[d1_databases]]
binding = "DB"
database_name = "affiliate-hub"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Use a different name for local development so local state is isolated.
[env.local]
vars = { CORS_ORIGIN = "http://localhost:5173,http://localhost:8080", PUBLIC_FRONTEND_URL = "http://localhost:5173", PUBLIC_API_URL = "http://localhost:8787" }
